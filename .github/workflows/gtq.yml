name: GTQ list
on:
  push:
    branches: [gtq-scrape]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install -U yt-dlp
      - name: Playlist items
        run: |
          rm -f out/pl_items.tsv
          for p in PL85IluG5Tb9oMjg6nqw6a8anUare7VosY PL85IluG5Tb9qTpoit2bNVVOEqXhhF5Vzf PL85IluG5Tb9otxa99xMM0eDtHNTRHo_XI PL85IluG5Tb9rPDY0HnHT7IKPv3zIhmiUU PL85IluG5Tb9pozFAMNNHBmN-l3SNQkf9r PL85IluG5Tb9qi4Dsu_O3I77cVWfqkhFm_ PL85IluG5Tb9q20LL-4iKpukxqgrX1tRqJ; do
            yt-dlp --flat-playlist --ignore-errors --print "$p|%(id)s|%(title)s" "https://www.youtube.com/playlist?list=$p" >> out/pl_items.tsv 2>> out/pl.err || true
          done
          wc -l out/pl_items.tsv
      - name: Save
        run: |
          git config user.name "gtq-bot"; git config user.email "gtq-bot@users.noreply.github.com"
          git add out; git commit -m "Playlist items" || true
          git push origin HEAD:gtq-scrape
